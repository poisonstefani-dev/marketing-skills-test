<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Список покупок</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px 40px;
    background: linear-gradient(135deg, #fff9f0 0%, #f0f8ff 50%, #fdf0ff 100%);
    font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
  }

  .app { width: 100%; max-width: 360px; }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .header-star { font-size: 38px; line-height: 1; }
  .header-center { text-align: center; }
  .header-heart { font-size: 11px; display: block; margin-bottom: -2px; }
  .header-title {
    font-size: 28px;
    font-weight: 900;
    color: #6B3FA0;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 8px rgba(107,63,160,.15);
    line-height: 1.1;
  }

  /* ITEMS */
  .items { display: flex; flex-direction: column; gap: 12px; }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 20px;
    background: #fff;
    cursor: pointer;
    border: 2.5px solid;
    transition: transform .15s, opacity .2s, box-shadow .15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .item:hover { transform: scale(1.02); }
  .item:active { transform: scale(0.98); }
  .item.checked { opacity: .7; }

  .item-icon {
    font-size: 26px;
    width: 52px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    flex-shrink: 0;
    line-height: 1;
  }

  .item-text { flex: 1; min-width: 0; }
  .item-name {
    font-size: 15px;
    font-weight: 700;
    color: #333;
    line-height: 1.25;
    transition: color .2s;
  }
  .item-sub {
    font-size: 13px;
    color: #666;
    margin-top: 2px;
    line-height: 1.2;
    transition: color .2s;
  }
  .item.checked .item-name,
  .item.checked .item-sub {
    text-decoration: line-through;
    color: #bbb;
  }

  .item-check {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2.5px solid;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background .2s, box-shadow .2s;
  }
  .item-check svg { display: none; }
  .item.checked .item-check svg { display: block; }

  /* PROGRESS */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
  }
  .progress-bar {
    flex: 1;
    height: 8px;
    border-radius: 99px;
    background: #eee;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, #7BC8F0, #B97CD3);
    transition: width .4s cubic-bezier(.4,0,.2,1);
  }
  .progress-label {
    font-size: 12px;
    font-weight: 700;
    color: #aaa;
    white-space: nowrap;
  }

  /* DONE MESSAGE */
  .done {
    display: none;
    text-align: center;
    margin-top: 20px;
    animation: pop .4s cubic-bezier(.4,0,.2,1);
  }
  .done.visible { display: block; }
  .done-title {
    font-size: 24px;
    font-weight: 900;
    color: #6DC96E;
  }
  .done-sub { color: #888; margin-top: 4px; font-size: 14px; }
  .reset-btn {
    margin-top: 12px;
    padding: 10px 28px;
    border: none;
    border-radius: 99px;
    background: linear-gradient(135deg, #B97CD3, #7BC8F0);
    color: #fff;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(185,124,211,.4);
    transition: transform .15s;
    font-family: inherit;
  }
  .reset-btn:hover { transform: scale(1.05); }
  .reset-btn:active { transform: scale(0.96); }

  @keyframes pop {
    from { opacity: 0; transform: scale(.8); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* CONFETTI CANVAS */
  #confetti {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 999;
  }
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="app">
  <div class="header">
    <span class="header-star">⭐</span>
    <div class="header-center">
      <span class="header-heart">❤️</span>
      <div class="header-title">Список покупок</div>
    </div>
    <span class="header-star">🛒</span>
  </div>

  <div class="items" id="items"></div>

  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="progress-label" id="progress-label">0/6</div>
  </div>

  <div class="done" id="done">
    <div class="done-title">Ура! Всё куплено! 🎉</div>
    <div class="done-sub">Молодец!</div>
    <button class="reset-btn" onclick="reset()">Начать заново</button>
  </div>
</div>

<script>
const AH = (id, rev) => `https://static.ah.nl/dam/product/AHI_${id}?revLabel=${rev||1}&rendition=200x200_JPG_Q85&fileType=binary`;

const ITEMS = [
  { img: AH('4354523130303237343433'),   name:'Овсяное молоко', sub:'маме в кофе',         color:'#7BC8F0' },
  { img: AH('54314d47784d4175514d7130324743474d3638656b51'), name:'Сметана',               color:'#6DC96E' },
  { img: AH('43545239383238313832'),     name:'Булочка и',      sub:'сгущенка папе',        color:'#F5A53E' },
  { img: AH('43545239383539313638', 2), name:'Шоколад Milka',                               color:'#B97CD3' },
  { img: AH('4354523130303632353939'),  name:'Колбаса',         sub:'и кубики и ломтики',   color:'#F07070' },
  { img: AH('4354523130303636343239'),  name:'Ягодный джем',                                color:'#9B72CF' },
  { img: AH('4354523130303135393430'),  name:'Киш лорен',                                   color:'#E8875A' },
];

const checked = new Set();
const total = ITEMS.length;

const container = document.getElementById('items');

ITEMS.forEach((item, i) => {
  const el = document.createElement('div');
  el.className = 'item';
  el.dataset.i = i;
  el.style.borderColor = item.color;
  el.style.boxShadow = `0 2px 10px ${item.color}44`;
  el.innerHTML = `
    <div class="item-icon" style="background:${item.color}22;overflow:hidden;padding:0"><img src="${item.img}" alt="" style="width:100%;height:100%;object-fit:contain;" onerror="this.style.display='none'"></div>
    <div class="item-text">
      <div class="item-name">${item.name}</div>
      ${item.sub ? `<div class="item-sub">${item.sub}</div>` : ''}
    </div>
    <div class="item-check" style="border-color:${item.color}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>`;
  el.addEventListener('click', () => toggle(i, el, item.color));
  container.appendChild(el);
});

function toggle(i, el, color) {
  if (checked.has(i)) {
    checked.delete(i);
    el.classList.remove('checked');
    el.querySelector('.item-check').style.background = 'transparent';
    el.querySelector('.item-check').style.boxShadow = 'none';
  } else {
    checked.add(i);
    el.classList.add('checked');
    el.querySelector('.item-check').style.background = color;
    el.querySelector('.item-check').style.boxShadow = `0 0 0 3px ${color}44`;
  }
  updateProgress();
}

function updateProgress() {
  const n = checked.size;
  document.getElementById('progress-fill').style.width = `${(n/total)*100}%`;
  document.getElementById('progress-label').textContent = `${n}/${total}`;
  const done = document.getElementById('done');
  if (n === total) {
    done.classList.add('visible');
    launchConfetti();
  } else {
    done.classList.remove('visible');
  }
}

function reset() {
  checked.clear();
  document.querySelectorAll('.item').forEach(el => {
    el.classList.remove('checked');
    el.querySelector('.item-check').style.background = 'transparent';
    el.querySelector('.item-check').style.boxShadow = 'none';
  });
  updateProgress();
  const canvas = document.getElementById('confetti');
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
}

/* ---- CONFETTI ---- */
const COLORS = ['#FF6B6B','#FFD700','#6DC96E','#7BC8F0','#B97CD3','#F5A53E','#FF69B4','#40E0D0'];

function launchConfetti() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const particles = [];
  const shapes = ['rect','circle','star'];

  for (let i = 0; i < 180; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: -Math.random() * 40,
      vx: (Math.random() - 0.5) * 7,
      vy: Math.random() * 4 + 2,
      rot: Math.random() * 360,
      rotV: (Math.random() - 0.5) * 14,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      w: Math.random() * 12 + 6,
      h: Math.random() * 6 + 3,
      alpha: 1,
      shape: shapes[Math.floor(Math.random() * 3)],
      wob: Math.random() * Math.PI * 2,
      wobV: Math.random() * 0.15 + 0.05,
    });
  }

  let raf, tick = 0;

  function drawStar(ctx, r) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const angle = (i * Math.PI) / 5 - Math.PI / 2;
      const radius = i % 2 === 0 ? r : r * 0.4;
      const x = Math.cos(angle) * radius, y = Math.sin(angle) * radius;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fill();
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    tick++;
    let alive = 0;
    for (const p of particles) {
      if (p.alpha <= 0) continue;
      alive++;
      p.x += p.vx + Math.sin(p.wob) * 0.8;
      p.y += p.vy; p.vy += 0.08; p.vx *= 0.995;
      p.rot += p.rotV; p.wob += p.wobV;
      if (tick > 90) p.alpha = Math.max(0, p.alpha - 0.012);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      else if (p.shape === 'circle') { ctx.beginPath(); ctx.arc(0,0,p.w/2,0,Math.PI*2); ctx.fill(); }
      else drawStar(ctx, p.w/2);
      ctx.restore();
    }
    if (alive > 0) raf = requestAnimationFrame(animate);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(animate);
}
</script>
</body>
</html>
